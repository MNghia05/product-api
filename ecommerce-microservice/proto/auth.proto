syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (UserResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (StatusResponse);
  rpc VerifyToken (TokenRequest) returns (VerifyResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LogoutRequest {
  string token = 1;
}

message TokenRequest {
  string token = 1;
}

message UserResponse {
  int32 uid = 1;
  string username = 2;
  string role = 3;
}

message LoginResponse {
  string token = 1;
  UserResponse user = 2;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message VerifyResponse {
  bool valid = 1;
  int32 uid = 2;
  string username = 3;
  string role = 4;
  string message = 5;
}
