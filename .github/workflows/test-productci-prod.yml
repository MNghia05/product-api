name: Product API - Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-mongo:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start server in background
        run: |
          nohup node server.js > server.log 2>&1 &
          sleep 5

      - name: Test CREATE product
        run: |
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"CI Test Product","price":100,"quantity":5}'

      - name: Test GET all products
        run: |
          curl -f http://localhost:3000/api/products

      - name: Show server log if failed
        if: failure()
        run: cat server.log